name: Phase 5 Historical 2020-2026 Backtest

on:
  workflow_dispatch:
    inputs:
      start:
        description: "Backtest start date"
        required: false
        default: "2020-01-01"
      end:
        description: "Backtest end date"
        required: false
        default: "2026-07-28"
  push:
    paths:
      - "scripts/build_historical_dataset.py"
      - "scripts/run_backtest.py"
      - ".github/workflows/phase5_historical.yml"

permissions:
  contents: read

jobs:
  historical:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Restore Hugging Face dataset cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface/hub
          key: tm-trade1-hf-nifty-daily-2020-2026-v1

      - name: Restore built DuckDB cache
        uses: actions/cache@v4
        with:
          path: |
            data/historical_2020_2026.duckdb
            data/historical_2020_2026.duckdb.sha256
            data/historical_manifest.json
          key: tm-trade1-historical-duckdb-2020-2026-v1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install pandas numpy scipy duckdb pyarrow huggingface_hub

      - name: Build historical market-data cache
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          START_DATE: "2020-01-01"
          END_DATE: "2026-07-28"
          OUT_DB: data/historical_2020_2026.duckdb
        run: |
          mkdir -p data results
          if [ ! -f "$OUT_DB" ]; then
            python scripts/build_historical_dataset.py
          else
            echo "Using restored DuckDB cache"
            sha256sum "$OUT_DB"
          fi

      - name: Verify dataset coverage
        run: |
          python - <<'PY'
          import duckdb
          con=duckdb.connect("data/historical_2020_2026.duckdb", read_only=True)
          print(con.execute("SELECT instrument_type, COUNT(*) AS row_count, MIN(date) AS first_date, MAX(date) AS last_date FROM bars GROUP BY instrument_type ORDER BY instrument_type").fetchdf().to_string(index=False))
          print(con.execute("SELECT MIN(expiry) first_expiry, MAX(expiry) last_expiry, COUNT(DISTINCT expiry) expiries FROM bars WHERE instrument_type='OPT'").fetchdf().to_string(index=False))
          PY

      - name: Run deterministic historical reconstruction
        env:
          START_DATE: ${{ inputs.start || '2020-01-01' }}
          END_DATE: ${{ inputs.end || '2026-07-28' }}
        run: |
          python scripts/run_backtest.py --db data/historical_2020_2026.duckdb --start "$START_DATE" --end "$END_DATE" --out results

      - name: Upload historical results
        uses: actions/upload-artifact@v4
        with:
          name: phase5-historical-backtest-results
          path: |
            results/**
            data/historical_manifest.json
            data/historical_2020_2026.duckdb.sha256
